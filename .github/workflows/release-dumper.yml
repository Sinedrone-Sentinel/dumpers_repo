name: Release BP Dumper

# Semantic-release only when dumper source changes; feat(dumper)/fix(dumper) commits cut a tag.
on:
  push:
    branches: [main]
    paths:
      - 'scripts/bp-dumper-go/**'
      - 'scripts/bp-dumper-py/**'
      - 'scripts/bp-dumper/**'
      - 'scripts/bp-dumper-launcher/**'
      - 'scripts/installer/**'
      - 'scripts/sync-dumper-version.mjs'
      - 'scripts/lib/syncDumperMinGameVersion.mjs'
      - 'release.config.js'
      - '.github/workflows/release-dumper.yml'
      - '.github/workflows/build-releases.yml'

# Least privilege: read-only at top level; write scopes only on the release job.
permissions:
  contents: read

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    steps:
      - name: Require RELEASE_TOKEN
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::Missing repo secret RELEASE_TOKEN. Protect main blocks github-actions[bot] from pushing; use a fine-grained PAT for the repo admin (Contents: Read and write). See docs/TRUST_AND_SIGNING.md"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          # Admin PAT can bypass Protect main (RepositoryRole Admin bypass on the ruleset).
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run semantic-release
        env:
          # Admin PAT: git push + GitHub Releases API (Protect main bypass).
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          # Job token for `gh workflow run` — fine-grained PATs often cannot dispatch Actions (403).
          # `gh` prefers GH_TOKEN over GITHUB_TOKEN.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npx semantic-release