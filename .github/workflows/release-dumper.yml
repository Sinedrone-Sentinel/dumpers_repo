name: Release BP Dumper

# Runs semantic-release only when dumper source changes; only feat(dumper)/fix(dumper) commits cut a tag.
on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            dumper:
              - 'scripts/bp-dumper-go/main.go'
              - 'scripts/bp-dumper-go/lookup.go'
              - 'scripts/bp-dumper-go/README.md'
              - 'scripts/bp-dumper-py/dumper.py'
              - 'scripts/bp-dumper-py/blueprint_lookup.py'
              - 'scripts/bp-dumper-py/dumper.bat'
              - 'scripts/bp-dumper-py/dumper.sh'
              - 'scripts/bp-dumper-py/requirements.txt'
              - 'scripts/bp-dumper-py/README.md'
              - 'scripts/bp-dumper/**'
              - 'scripts/sync-dumper-version.mjs'
              - 'release.config.js'
              - '.github/workflows/release-dumper.yml'
              - '.github/workflows/build-releases.yml'

      - name: Setup Node
        if: steps.changes.outputs.dumper == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.changes.outputs.dumper == 'true'
        run: npm ci

      - name: Run semantic-release
        if: steps.changes.outputs.dumper == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npx semantic-release
