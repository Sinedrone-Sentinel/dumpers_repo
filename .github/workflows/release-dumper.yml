name: Release BP Dumper

# Semantic-release only when dumper source changes; feat(dumper)/fix(dumper) commits cut a tag.
on:
  push:
    branches: [main]
    paths:
      - 'scripts/bp-dumper-go/**'
      - 'scripts/bp-dumper-py/**'
      - 'scripts/bp-dumper/**'
      - 'scripts/sync-dumper-version.mjs'
      - 'scripts/lib/syncDumperMinGameVersion.mjs'
      - 'release.config.js'
      - '.github/workflows/release-dumper.yml'
      - '.github/workflows/build-releases.yml'

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npx semantic-release
