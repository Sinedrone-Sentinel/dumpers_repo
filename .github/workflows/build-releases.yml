name: Build Executables on Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.2.0)'
        required: true
        default: 'v1.2.0'

jobs:
  resolve-tag:
    name: Resolve release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [[ "${{ github.ref_name }}" == v* ]]; then
            TAG="${{ github.ref_name }}"
          else
            VERSION=$(node -p "require('./scripts/bp-dumper/version.json').version")
            TAG="v${VERSION}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Read dumper version
        id: version
        run: |
          VERSION=$(node -p "require('./scripts/bp-dumper/version.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build-windows-exe:
    name: Build Windows exe
    needs: resolve-tag
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Copy blueprint lookup
        run: node scripts/copy-blueprint-lookup.mjs

      - name: Build single-file DumperApps exe
        shell: pwsh
        timeout-minutes: 45
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass
          $version = "${{ needs.resolve-tag.outputs.version }}"
          & "$env:GITHUB_WORKSPACE/scripts/installer/build-exe.ps1" -Version $version

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: scripts/installer/output/DumperApps.exe

  release:
    name: Upload GitHub Release assets
    needs: [resolve-tag, build-windows-exe]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload exe to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-tag.outputs.tag }}
          files: artifacts/windows-exe/DumperApps.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
