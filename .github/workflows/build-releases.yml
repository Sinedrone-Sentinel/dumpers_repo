name: Build Executables on Release

# SignPath optional: set SIGNPATH_* after OSS approval (OSI license required — docs/TRUST_AND_SIGNING.md).
# Without secrets, the unsigned Python-built exe is still published to the GitHub Release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.2.0)'
        required: true
        default: 'v1.2.0'

jobs:
  resolve-tag:
    name: Resolve release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [[ "${{ github.ref_name }}" == v* ]]; then
            TAG="${{ github.ref_name }}"
          else
            VERSION=$(node -p "require('./scripts/bp-dumper/version.json').version")
            TAG="v${VERSION}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Read dumper version
        id: version
        run: |
          VERSION=$(node -p "require('./scripts/bp-dumper/version.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build-windows-exe:
    name: Build Windows exe
    needs: resolve-tag
    runs-on: windows-latest
    timeout-minutes: 90
    outputs:
      unsigned_artifact_id: ${{ steps.upload-unsigned.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Copy blueprint lookup
        run: node scripts/copy-blueprint-lookup.mjs

      - name: Build single-file DumperApps.exe
        shell: pwsh
        timeout-minutes: 45
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass
          $version = "${{ needs.resolve-tag.outputs.version }}"
          & "$env:GITHUB_WORKSPACE/scripts/installer/build-exe.ps1" -Version $version

      - name: Upload unsigned exe artifact
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe-unsigned
          path: scripts/installer/output/DumperApps.exe
          if-no-files-found: error

  sign-and-release:
    name: Sign (optional) and publish Release
    needs: [resolve-tag, build-windows-exe]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check SignPath config
        id: signpath
        env:
          TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          ORG_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          PROJECT: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          POLICY: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ORG_ID" ] && [ -n "$PROJECT" ] && [ -n "$POLICY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SignPath not configured — publishing UNSIGNED DumperApps.exe. See docs/TRUST_AND_SIGNING.md"
          fi

      - name: Sign with SignPath
        if: steps.signpath.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: dumper-apps-exe
          github-artifact-id: ${{ needs.build-windows-exe.outputs.unsigned_artifact_id }}
          wait-for-completion: true
          output-artifact-directory: dist/

      - name: Download unsigned exe
        if: steps.signpath.outputs.enabled != 'true'
        uses: actions/download-artifact@v4
        with:
          name: windows-exe-unsigned
          path: dist/

      - name: Upload exe to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-tag.outputs.tag }}
          files: dist/DumperApps.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
