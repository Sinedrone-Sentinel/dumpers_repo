name: Build Executables on Release

# SignPath optional: set SIGNPATH_* after OSS approval (OSI license required — docs/TRUST_AND_SIGNING.md).
# Without secrets, the unsigned Python-built exe is still published to the GitHub Release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.2.0)'
        required: true
        default: 'v1.2.0'

# Least privilege: read-only at top level; write only on the publish job.
permissions:
  contents: read

jobs:
  resolve-tag:
    name: Resolve release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [[ "${{ github.ref_name }}" == v* ]]; then
            TAG="${{ github.ref_name }}"
          else
            VERSION=$(node -p "require('./scripts/bp-dumper/version.json').version")
            TAG="v${VERSION}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Read dumper version
        id: version
        run: |
          VERSION=$(node -p "require('./scripts/bp-dumper/version.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build-windows-exe:
    name: Build Windows exe
    needs: resolve-tag
    runs-on: windows-latest
    timeout-minutes: 90
    outputs:
      unsigned_artifact_id: ${{ steps.upload-unsigned.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Copy blueprint lookup
        run: node scripts/copy-blueprint-lookup.mjs

      - name: Build single-file DumperApps.exe
        shell: pwsh
        timeout-minutes: 45
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass
          $version = "${{ needs.resolve-tag.outputs.version }}"
          & "$env:GITHUB_WORKSPACE/scripts/installer/build-exe.ps1" -Version $version

      - name: Upload unsigned exe artifact
        id: upload-unsigned
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-exe-unsigned
          path: scripts/installer/output/DumperApps.exe
          if-no-files-found: error

  sign-and-release:
    name: Sign (optional) and publish Release
    needs: [resolve-tag, build-windows-exe]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      id-token: write # cosign keyless (Sigstore)
    steps:
      - name: Check SignPath config
        id: signpath
        env:
          TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          ORG_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          PROJECT: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          POLICY: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ORG_ID" ] && [ -n "$PROJECT" ] && [ -n "$POLICY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SignPath not configured — publishing UNSIGNED DumperApps.exe. See docs/TRUST_AND_SIGNING.md"
          fi

      - name: Sign with SignPath
        if: steps.signpath.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@ced31329c0317e779dad2eec2a7c3bb46ea1343e # v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: dumper-apps-exe
          github-artifact-id: ${{ needs.build-windows-exe.outputs.unsigned_artifact_id }}
          wait-for-completion: true
          output-artifact-directory: dist/
          parameters: |
            version: ${{ toJSON(needs.resolve-tag.outputs.version) }}

      - name: Download unsigned exe
        if: steps.signpath.outputs.enabled != 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-exe-unsigned
          path: dist/

      - name: Install cosign
        uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0

      - name: Checksums and cosign-signed manifest
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum DumperApps.exe > SHA256SUMS
          cosign sign-blob --yes --bundle SHA256SUMS.sig SHA256SUMS
          echo "SHA256SUMS:"
          cat SHA256SUMS

      - name: Upload exe to GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.resolve-tag.outputs.tag }}
          files: |
            dist/DumperApps.exe
            dist/SHA256SUMS
            dist/SHA256SUMS.sig
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
