name: Build Executables on Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.2.0)'
        required: true
        default: 'v1.2.0'

jobs:
  resolve-tag:
    name: Resolve release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [[ "${{ github.ref_name }}" == v* ]]; then
            TAG="${{ github.ref_name }}"
          else
            VERSION=$(node -p "require('./scripts/bp-dumper/version.json').version")
            TAG="v${VERSION}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Read dumper version
        id: version
        run: |
          VERSION=$(node -p "require('./scripts/bp-dumper/version.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build-windows-installer:
    name: Build Windows installer
    needs: resolve-tag
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Copy blueprint lookup
        run: node scripts/copy-blueprint-lookup.mjs

      - name: Stage self-contained bundle
        shell: pwsh
        timeout-minutes: 45
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass
          & "$env:GITHUB_WORKSPACE/scripts/installer/prepare-bundle.ps1"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compile installer
        shell: pwsh
        timeout-minutes: 30
        run: |
          $version = "${{ needs.resolve-tag.outputs.version }}"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC not found at $iscc" }
          & $iscc "/DAppVersion=$version" "$env:GITHUB_WORKSPACE/scripts/installer/dumper-apps.iss"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: scripts/installer/output/DumperApps-Setup-*.exe

  release:
    name: Upload GitHub Release assets
    needs: [resolve-tag, build-windows-installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-tag.outputs.tag }}
          files: artifacts/windows-installer/DumperApps-Setup-*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
