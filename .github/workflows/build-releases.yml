name: Build Executables on Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.2.0)'
        required: true
        default: 'v1.2.0'

jobs:
  build:
    name: Build Go and Python Dumpers
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [[ "${{ github.ref_name }}" == v* ]]; then
            TAG="${{ github.ref_name }}"
          else
            VERSION=$(node -p "require('./scripts/bp-dumper/version.json').version")
            TAG="v${VERSION}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: Read dumper version
        id: version
        run: |
          VERSION=$(node -p "require('./scripts/bp-dumper/version.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building BP Dumper v$VERSION"

      - name: Read min game version
        id: mingame
        run: |
          MIN_VER=$(node -p "(() => { const v = require('./src/data/game-build-version.json').version; const m = String(v).match(/^(\\d+\\.\\d+)/); if (!m) throw new Error('Invalid game version: ' + v); return m[1]; })()")
          echo "min_version=$MIN_VER" >> "$GITHUB_OUTPUT"
          echo "Min game version: $MIN_VER"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: false

      - name: Copy blueprint lookup for client builds
        run: node scripts/copy-blueprint-lookup.mjs

      - name: Build Go binaries
        env:
          DUMPER_VERSION: ${{ steps.version.outputs.version }}
          MIN_GAME_VERSION: ${{ steps.mingame.outputs.min_version }}
        run: |
          cd scripts/bp-dumper-go
          mkdir -p dist
          LDFLAGS="-X main.DumperVersion=${DUMPER_VERSION} -X main.MinGameVersion=${MIN_GAME_VERSION} -s -w"

          GOOS=windows GOARCH=amd64 go build -ldflags="$LDFLAGS" -o dist/bp-dumper-windows.exe
          GOOS=darwin GOARCH=amd64 go build -ldflags="$LDFLAGS" -o dist/bp-dumper-mac-intel
          GOOS=darwin GOARCH=arm64 go build -ldflags="$LDFLAGS" -o dist/bp-dumper-mac-silicon
          GOOS=linux GOARCH=amd64 go build -ldflags="$LDFLAGS" -o dist/bp-dumper-linux

      - name: Package Python dumper + Rock Scanner
        run: |
          STAGE=$(mktemp -d)
          mkdir -p "$STAGE/scripts/bp-dumper-py" "$STAGE/scripts/rock-scan-ocr/vendor"
          cp scripts/bp-dumper-py/dumper.py \
             scripts/bp-dumper-py/_version.py \
             scripts/bp-dumper-py/_min_game_version.py \
             scripts/bp-dumper-py/blueprint_lookup.py \
             scripts/bp-dumper-py/lookup.json \
             scripts/bp-dumper-py/requirements.txt \
             scripts/bp-dumper-py/README.md \
             scripts/bp-dumper-py/dumper.bat \
             scripts/bp-dumper-py/dumper.sh \
             "$STAGE/scripts/bp-dumper-py/"
          cp START-HERE.bat RESTART-TRAY.bat RESTART-TRAY.vbs "$STAGE/"
          rsync -a --exclude '__pycache__' --exclude '*.pyc' --exclude 'rock-scan-exports' \
            --exclude 'sc-toolbox.path' --exclude 'capture-region.json' --exclude 'vendor' \
            scripts/rock-scan-ocr/ "$STAGE/scripts/rock-scan-ocr/"
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/ScPlaceholder/SC-Toolbox-Beta-V2.git /tmp/sc-toolbox
          cd /tmp/sc-toolbox
          git sparse-checkout set tools/Mining_Signals
          cd -
          rsync -a /tmp/sc-toolbox/tools/Mining_Signals/ "$STAGE/scripts/rock-scan-ocr/vendor/Mining_Signals/"
          MODELS="$STAGE/scripts/rock-scan-ocr/vendor/Mining_Signals/ocr/models"
          if [ -f "$MODELS/model_hud_cnn.onnx" ] && [ ! -f "$MODELS/model_hud_cnn.onnx.data" ]; then
            mv "$MODELS/model_hud_cnn.onnx" "$MODELS/model_hud_cnn.onnx.missing_data"
          fi
          cd "$STAGE"
          zip -r "$GITHUB_WORKSPACE/scripts/bp-dumper-py.zip" .

      - name: Upload binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: |
            scripts/bp-dumper-go/dist/bp-dumper-windows.exe
            scripts/bp-dumper-go/dist/bp-dumper-mac-intel
            scripts/bp-dumper-go/dist/bp-dumper-mac-silicon
            scripts/bp-dumper-go/dist/bp-dumper-linux
            scripts/bp-dumper-py.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
