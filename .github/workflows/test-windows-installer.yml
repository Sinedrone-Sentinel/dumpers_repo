name: Test Windows portable build

# Manual smoke test for DumperApps exe build (no GitHub Release upload).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-exe:
    name: Build Windows exe (test)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Read dumper version
        id: version
        shell: pwsh
        run: |
          $version = node -p "require('./scripts/bp-dumper/version.json').version"
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Copy blueprint lookup
        run: node scripts/copy-blueprint-lookup.mjs

      - name: Build single-file DumperApps exe
        shell: pwsh
        timeout-minutes: 45
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass
          & "$env:GITHUB_WORKSPACE/scripts/installer/build-exe.ps1" -Version "${{ steps.version.outputs.version }}"
          Get-ChildItem "$env:GITHUB_WORKSPACE/scripts/installer/output/DumperApps.exe" |
            ForEach-Object { Write-Host "Built $($_.Name) ($([math]::Round($_.Length / 1MB, 1)) MB)" }

      - name: Upload exe artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: DumperApps-exe-test
          path: scripts/installer/output/DumperApps.exe
