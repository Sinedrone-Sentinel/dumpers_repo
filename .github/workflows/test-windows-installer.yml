name: Test Windows Installer Build

# Manual smoke test for DumperApps-Setup build (no GitHub Release upload).
on:
  workflow_dispatch:

jobs:
  build-windows-installer:
    name: Build Windows installer (test)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/bp-dumper-py/requirements.txt

      - name: Read dumper version
        id: version
        shell: pwsh
        run: |
          $version = node -p "require('./scripts/bp-dumper/version.json').version"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Copy blueprint lookup
        run: node scripts/copy-blueprint-lookup.mjs

      - name: Install Python packages into portable venv
        shell: pwsh
        run: |
          python -m venv "$env:RUNNER_TEMP/dumper-python"
          & "$env:RUNNER_TEMP/dumper-python/Scripts/python.exe" -m pip install --upgrade pip
          & "$env:RUNNER_TEMP/dumper-python/Scripts/pip.exe" install `
            -r scripts/bp-dumper-py/requirements.txt `
            --prefer-binary

      - name: Stage self-contained bundle
        shell: pwsh
        timeout-minutes: 20
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass
          & "$env:GITHUB_WORKSPACE/scripts/installer/prepare-bundle.ps1" `
            -PythonVenvPath "$env:RUNNER_TEMP/dumper-python"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compile installer
        shell: pwsh
        timeout-minutes: 30
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC not found at $iscc" }
          & $iscc "/DAppVersion=$version" "$env:GITHUB_WORKSPACE/scripts/installer/dumper-apps.iss"
          Get-ChildItem "$env:GITHUB_WORKSPACE/scripts/installer/output" -Filter "DumperApps-Setup-*.exe" |
            ForEach-Object { Write-Host "Built $($_.FullName) ($([math]::Round($_.Length/1MB, 1)) MB)" }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: DumperApps-Setup-test
          path: scripts/installer/output/DumperApps-Setup-*.exe
          retention-days: 7
