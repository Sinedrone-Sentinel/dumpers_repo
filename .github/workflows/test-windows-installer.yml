name: Test Windows portable build

# Manual smoke test for DumperApps portable exe (no GitHub Release upload).
on:
  workflow_dispatch:

jobs:
  build-windows-portable:
    name: Build Windows portable exe (test)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Read dumper version
        id: version
        shell: pwsh
        run: |
          $version = node -p "require('./scripts/bp-dumper/version.json').version"
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Copy blueprint lookup
        run: node scripts/copy-blueprint-lookup.mjs

      - name: Stage self-contained bundle
        shell: pwsh
        timeout-minutes: 45
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass
          & "$env:GITHUB_WORKSPACE/scripts/installer/prepare-bundle.ps1"

      - name: Install 7-Zip
        run: choco install 7zip -y --no-progress

      - name: Build portable self-extracting exe
        shell: pwsh
        timeout-minutes: 20
        run: |
          & "$env:GITHUB_WORKSPACE/scripts/installer/build-portable.ps1" -Version "${{ steps.version.outputs.version }}"
          Get-ChildItem "$env:GITHUB_WORKSPACE/scripts/installer/output" -Filter "DumperApps-*.exe" |
            ForEach-Object { Write-Host "Built $($_.Name) ($([math]::Round($_.Length / 1MB, 1)) MB)" }

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: DumperApps-portable-test
          path: scripts/installer/output/DumperApps-*.exe
