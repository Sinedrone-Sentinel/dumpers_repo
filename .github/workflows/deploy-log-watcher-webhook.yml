name: Deploy log-watcher-webhook

# Redeploy the BP Dumper webhook when lookup data or function code changes.
on:
  push:
    branches: [main]
    paths:
      - 'src/data/blueprint-name-lookup.json'
      - 'supabase/functions/log-watcher-webhook/**'
      - 'supabase/functions/_shared/blueprintResolver.ts'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy log-watcher-webhook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Copy blueprint lookup into Edge Function bundle
        run: npm run copy-blueprint-lookup

      - name: Deploy log-watcher-webhook
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "Skipping deploy: SUPABASE_ACCESS_TOKEN or SUPABASE_PROJECT_REF not configured."
            echo "Run locally: npm run copy-blueprint-lookup && npx supabase functions deploy log-watcher-webhook --no-verify-jwt"
            exit 0
          fi
          npx supabase link --project-ref "$SUPABASE_PROJECT_REF"
          npx supabase functions deploy log-watcher-webhook --no-verify-jwt
