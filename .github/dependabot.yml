# Dependabot kept for Scorecard, but open-pull-requests-limit: 0
# so it does NOT open version-update PRs. Bump deps by hand when you care.
# Security alerts (if enabled in repo settings) are separate from this file.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0

  - package-ecosystem: pip
    directory: /scripts/bp-dumper-py
    schedule:
      interval: monthly
    open-pull-requests-limit: 0

  - package-ecosystem: gomod
    directory: /scripts/bp-dumper-go
    schedule:
      interval: monthly
    open-pull-requests-limit: 0