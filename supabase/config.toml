# pg_cron → send-discord uses service_role Bearer (not a user JWT).
[functions.send-discord]
enabled = true
verify_jwt = false
entrypoint = "./functions/send-discord/index.ts"

[functions.log-watcher-webhook]
enabled = true
verify_jwt = false
entrypoint = "./functions/log-watcher-webhook/index.ts"

# Discord POSTs interactions with ed25519 signatures (no Supabase JWT).
[functions.discord-services-interactions]
enabled = true
verify_jwt = false
entrypoint = "./functions/discord-services-interactions/index.ts"

# Member-triggered fan-out after request_service (JWT required).
[functions.discord-services-dispatch]
enabled = true
verify_jwt = true
entrypoint = "./functions/discord-services-dispatch/index.ts"

# Cron / service_role: expire open requests + red Timed out Discord patches.
[functions.discord-services-expire]
enabled = true
verify_jwt = false
entrypoint = "./functions/discord-services-expire/index.ts"

# Approved partners fetch bot invite URL (reads DISCORD_SERVICES_APPLICATION_ID).
[functions.discord-services-bot-invite]
enabled = true
verify_jwt = true
entrypoint = "./functions/discord-services-bot-invite/index.ts"